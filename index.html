<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam QR Launcher</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #1b2838; color: #c7d5e0; margin: 0; padding: 24px; }
  h1 { margin: 0 0 4px; color: #fff; }
  p.sub { margin: 0 0 24px; opacity: .7; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { position: relative; background: #fff; color: #111; border-radius: 10px; overflow: hidden; text-align: center; }
  .card img.cover { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; display: block; background: #2a475e; }
  .card .name { font-weight: 600; padding: 10px 10px 2px; }
  /* The QR code stays hidden until the QR button shows it over the card. */
  .card .qr { display: none; position: absolute; inset: 0; z-index: 1; background: #fff; align-items: center; justify-content: center; cursor: pointer; }
  .card.show-qr .qr { display: flex; }
  .card .qr svg { width: 180px; height: 180px; display: block; }
  .card .tools { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 6px; }
  .card .tools button { width: 32px; height: 32px; padding: 6px; border-radius: 99px; background: rgba(15,25,34,.75); display: grid; place-items: center; }
  .card .tools button:hover, .card.show-qr .tools .show-qr { background: #3d6c8d; }
  .card .tools svg { width: 18px; height: 18px; }
  .card .meta { font-size: 12px; opacity: .65; padding: 0 10px 12px; }
  .card .meta:empty { display: none; }
  .card .desc { display: none; } /* labels only */
  .card .links { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 10px 12px; }
  .card .links:empty { display: none; }
  .card .link { display: inline-flex; align-items: center; gap: 4px; background: #e7eef4; border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12px; }
  .card .link code { font-size: 12px; }
  .card .link svg { width: 14px; height: 14px; color: #1b2838; flex: none; }
  .card .link button { background: transparent; color: #555; padding: 0 6px; border-radius: 99px; line-height: 18px; }
  .card .link button:hover { background: #c94b4b; color: #fff; }
  body.linking .card { cursor: pointer; outline: 3px solid transparent; transition: outline-color .15s; }
  body.linking .card:hover { outline-color: #e8a33d; }
  .banner { display: none; position: sticky; top: 0; z-index: 1; margin: 0 0 20px; padding: 14px 18px; border-radius: 10px; background: #e8a33d; color: #1b2838; font-weight: 600; }
  body.linking .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .banner code { font-size: 15px; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; background: #2a475e; color: #fff; }
  button:hover { background: #3d6c8d; }
  .muted { opacity: .7; }
  header { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
  .header-actions { display: flex; gap: 8px; flex: none; }
  header button { padding: 8px 16px; }

  select { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid #3d6c8d; background: #0f1922; color: #fff; }

  /* Printing builds #print-root from the template's sheet geometry (see TEMPLATES). */
  #print-root { display: none; }
  @media print {
    html, body { background: #fff; padding: 0; margin: 0; }
    body > :not(#print-root) { display: none !important; }
    #print-root { display: block; }
  }
  .sheet { box-sizing: border-box; overflow: hidden; display: grid; break-after: page; }
  .sheet:last-child { break-after: auto; }
  /* Cards print portrait. On landscape stock (Avery, labels) each card is turned
     90° inside its cell; see place(). */
  .cell { position: relative; overflow: hidden; contain: strict; } /* without it Chrome misplaces turned cards on multi-page prints */
  .pcard { box-sizing: border-box; overflow: hidden; background: #fff; color: #000; font-family: system-ui, sans-serif; }
  /* Side A: the portrait library art. */
  .pcard.art { padding: 0 !important; background: #111; }
  .pcard.art img.hero { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pcard.art img.logo { position: absolute; left: 8%; right: 8%; bottom: 8%; width: 84%; height: 30%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 0.5mm 1.2mm rgba(0,0,0,.6)); }
  .pcard.art .title { position: absolute; left: 3mm; right: 3mm; bottom: 4mm; color: #fff; font-size: 12pt; font-weight: 700; text-align: center; text-shadow: 0 0.3mm 1.5mm #000; }
  /* Side B: details, tags and optional QR. */
  .pcard.back { display: flex; flex-direction: column; gap: 1.2mm; }
  .pcard.back .name { font-size: 11pt; font-weight: 700; line-height: 1.15; }
  .pcard.back .credits { font-size: 6.5pt; line-height: 1.35; }
  .pcard.back .credits b { font-weight: 600; }
  .pcard.back .meta { font-size: 6.5pt; opacity: .8; }
  .pcard.back .tags { display: flex; flex-wrap: wrap; gap: 0.8mm; }
  .pcard.back .tags span { font-size: 5.5pt; line-height: 1; padding: 0.6mm 1.2mm; border: 0.2mm solid #000; border-radius: 1mm; white-space: nowrap; }
  .pcard.back .desc { flex: 1; min-height: 0; font-size: 6pt; line-height: 1.3; overflow: hidden; }
  .pcard.back .qr { flex: none; align-self: center; }
  .pcard.back .qr svg { width: 24mm; height: 24mm; display: block; }
  .pcard.back > :empty { display: none; }
  .sheet.cutlines .cell { border: 0.2mm dashed #9aa; }
  #print-root.rounded .cell { border-radius: 3.18mm; } /* the standard 1/8 in card corner */
  .sheet.mono img { filter: grayscale(1) contrast(1.15); }

  .print-bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 0 0 20px; padding: 10px 14px; border: 1px solid #2a475e; border-radius: 10px; font-size: 14px; }
  .print-bar .title { color: #fff; font-weight: 600; }
  .print-bar label { display: inline-flex; gap: 6px; align-items: center; }
  .print-bar label.disabled { opacity: .45; }
  .print-bar button { padding: 8px 16px; margin-left: auto; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <span>New card <code id="pending-uid"></code> on the base — click a game to link it.</span>
  <button id="cancel-link" title="Forget this card (Esc)">Cancel</button>
</div>
<header>
  <div>
    <h1>Steam QR Launcher</h1>
    <p class="sub">Scan with your phone camera on the same Wi-Fi, or with a scanner on this PC. Codes point at {{.Base}}</p>
  </div>
  <div class="header-actions">
    <button onclick="location.href='/settings'">Settings</button>
  </div>
</header>
<section class="print-bar" aria-label="Print settings">
  <span class="title">Print</span>
  <label>Template <select id="template"></select></label>
  <label title="Side A is the full art; side B is the game details. Both sides prints double-sided: set the printer to print on both sides, flip on long edge.">
    Sides <select id="sides">
      <option value="ab">Both sides (A art, B details)</option>
      <option value="a">Side A only (art)</option>
      <option value="b">Side B only (details)</option>
    </select></label>
  <label id="qrLabel" title="Include the QR code on side B"><input type="checkbox" id="showQR" checked> QR code on side B</label>
  <label id="oneSheetLabel" title="Print each card's side A and side B next to each other on one sheet, for printers without double-sided printing. Cut them out and glue them back to back."><input type="checkbox" id="oneSheet"> A and B on one sheet</label>
  <label title="Round the card corners; otherwise they print square"><input type="checkbox" id="rounded"> Rounded corners</label>
  <button id="print" title="Print at 100% scale with margins set to None or Default">Print cards</button>
</section>
<div class="grid" id="grid"></div>
<div id="print-root"></div>
<style id="page-style"></style>
<script>
  const APPS = {{.Apps}};
  const BASE = {{.Base}};
  const KEY = {{.Key}};
  const NFC = {{.NFC}};
  const DETAILS = {{.Details}};
  const grid = document.getElementById("grid");
  const cardEls = {};
  let pending = null;
  const ICON_QR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 20h4v-3"/></svg>`;
  const ICON_PRINT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="6" y="14" width="12" height="7"/></svg>`;

  for (const { id, name } of APPS) {
    const url = `${BASE}/launch/${id}?k=${encodeURIComponent(KEY)}`;
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img class="cover" src="/cover/${id}" data-cdn="https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg"
        onerror="if (this.dataset.cdn) { this.src = this.dataset.cdn; this.dataset.cdn = ''; } else this.style.visibility = 'hidden'">
      <div class="tools">
        <button class="show-qr" title="Show QR code" aria-label="Show QR code">${ICON_QR}</button>
        <button class="print-one" title="Print this card" aria-label="Print this card">${ICON_PRINT}</button>
      </div>
      <div class="qr" title="Click to hide">${qr.createSvgTag({ scalable: true, margin: 2 })}</div>
      <div class="name"></div>
      <div class="meta"></div>
      <div class="desc"></div>
      <div class="links"></div>`;
    card.querySelector(".name").textContent = name;
    const d = DETAILS[id];
    if (d) {
      card.querySelector(".meta").textContent = [d.developer, d.year, (d.genres || []).slice(0, 2).join(", ")].filter(Boolean).join(" · ");
      card.querySelector(".desc").textContent = d.description || "";
    }
    card.title = url;
    card.querySelector(".show-qr").addEventListener("click", e => {
      e.stopPropagation();
      card.classList.toggle("show-qr");
    });
    card.querySelector(".qr").addEventListener("click", e => {
      e.stopPropagation();
      card.classList.remove("show-qr");
    });
    card.querySelector(".print-one").addEventListener("click", e => {
      e.stopPropagation();
      printCards([{ id }], e.currentTarget);
    });
    card.addEventListener("click", () => { if (pending) api("link", { uid: pending.uid, appid: id }); });
    grid.appendChild(card);
    cardEls[id] = card;
  }

  async function api(action, body) {
    const res = await fetch(action ? `/api/cards/${action}` : "/api/cards", {
      method: action ? "POST" : "GET",
      headers: { "X-Key": KEY, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.ok) render(await res.json());
  }

  function render({ pending: p, cards }) {
    pending = p;
    document.body.classList.toggle("linking", !!p);
    document.getElementById("pending-uid").textContent = p ? p.uid : "";

    const byApp = {};
    for (const c of cards) (byApp[c.appid] ||= []).push(c.uid);
    for (const [id, el] of Object.entries(cardEls)) {
      const uids = (byApp[id] || []).sort();
      const links = el.querySelector(".links");
      if (links.dataset.uids === uids.join()) continue; // unchanged; don't rebuild under the cursor
      links.dataset.uids = uids.join();
      links.replaceChildren(...uids.map(uid => {
        const chip = document.createElement("span");
        chip.className = "link";
        chip.title = "NFC card linked to this game";
        chip.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-label="NFC"><path d="M7 9a4.5 4.5 0 0 1 0 6"/><path d="M10.5 6a9 9 0 0 1 0 12"/><path d="M14 3a13.5 13.5 0 0 1 0 18"/></svg><code></code><button title="Unlink this card">×</button>`;
        chip.querySelector("code").textContent = uid;
        chip.querySelector("button").addEventListener("click", e => {
          e.stopPropagation();
          api("unlink", { uid });
        });
        return chip;
      }));
    }
  }

  // Print templates. card is the cell on the stock; rotate turns portrait
  // cards to fit landscape cells. All sizes are what the stock measures; Avery lists
  // 28877 as using the same layout as 5371 (2 × 5, 0.5in top, 0.75in sides).
  const TEMPLATES = {
    "avery-28877": { label: "Avery 28877 Clean Edge (10 per sheet)", page: ["8.5in", "11in"], cols: 2, rows: 5,
                     card: ["3.5in", "2in"], margin: "0.5in 0.75in", gap: "0", pad: "3mm", rotate: true },
    "avery-5371":  { label: "Avery 5371 business cards (10 per sheet)", page: ["8.5in", "11in"], cols: 2, rows: 5,
                     card: ["3.5in", "2in"], margin: "0.5in 0.75in", gap: "0", pad: "3mm", rotate: true },
    "cr80":        { label: "Credit card size, 54 × 85.6 mm (9 per sheet)", page: ["8.5in", "11in"], cols: 3, rows: 3,
                     card: ["53.98mm", "85.6mm"], gap: "6mm", center: true, cutlines: true, pad: "3mm" },
    "trading":     { label: "Trading card, 63 × 88 mm (9 per sheet)", page: ["8.5in", "11in"], cols: 3, rows: 3,
                     card: ["63mm", "88mm"], gap: "0", center: true, cutlines: true, pad: "3mm" },
    "toploader":   { label: "Top loader, 2¾ × 3⅞ in (6 per sheet)", page: ["8.5in", "11in"], cols: 2, rows: 3,
                     card: ["3.875in", "2.75in"], gap: "5mm", center: true, cutlines: true, pad: "3mm", rotate: true },
    "labelife":    { label: "LabelLife thermal label, 3 × 2 in", page: ["3in", "2in"], cols: 1, rows: 1,
                     card: ["3in", "2in"], gap: "0", mono: true, pad: "2.5mm", singleSided: true, rotate: true },
  };
  const $ = id => document.getElementById(id);
  const prefs = (() => { try { return JSON.parse(localStorage.getItem("printPrefs")) || {}; } catch { return {}; } })();
  for (const [id, t] of Object.entries(TEMPLATES)) $("template").append(new Option(t.label, id));
  $("template").value = TEMPLATES[prefs.template] ? prefs.template : "avery-28877";
  $("sides").value = ["a", "b", "ab"].includes(prefs.sides) ? prefs.sides : "ab";
  $("showQR").checked = prefs.showQR !== false;
  $("rounded").checked = !!prefs.rounded;
  $("oneSheet").checked = !!prefs.oneSheet;

  function syncPrintBar() {
    // Labels are one-sided, so they print side A or side B, not both.
    const single = !!TEMPLATES[$("template").value].singleSided;
    $("sides").querySelector('option[value="ab"]').disabled = single;
    if (single && $("sides").value === "ab") $("sides").value = "b";
    const hasB = $("sides").value !== "a";
    $("showQR").disabled = !hasB;
    $("qrLabel").classList.toggle("disabled", !hasB);
    $("oneSheet").disabled = $("sides").value !== "ab";
    $("oneSheetLabel").classList.toggle("disabled", $("oneSheet").disabled);
    try {
      localStorage.setItem("printPrefs", JSON.stringify({ template: $("template").value, sides: $("sides").value, showQR: $("showQR").checked, rounded: $("rounded").checked, oneSheet: $("oneSheet").checked }));
    } catch {}
  }
  for (const id of ["template", "sides", "showQR", "rounded", "oneSheet"]) $(id).addEventListener("change", syncPrintBar);
  syncPrintBar();

  const loadImg = (img, ...srcs) => (async () => {
    for (const src of srcs) {
      img.src = src;
      try { await img.decode(); return true; } catch {}
    }
    img.remove();
    return false;
  })();

  function div(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    if (text) el.textContent = text;
    return el;
  }

  // Side A: the portrait library art. Without it, the hero art with the logo
  // over it, then the header art; the name when there's no logo.
  function artCard(id, el, opts, waits) {
    const pc = div("pcard art");
    const art = document.createElement("img");
    art.className = "hero";
    pc.append(art);
    const CDN = `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}`;
    waits.push((async () => {
      if (await loadImg(art, `/art/${id}/capsule`, `${CDN}/library_600x900_2x.jpg`, `${CDN}/library_600x900.jpg`)) return;
      const hero = document.createElement("img");
      hero.className = "hero";
      pc.append(hero);
      if (!await loadImg(hero, `/art/${id}/hero`, `${CDN}/library_hero.jpg`, `/art/${id}/header`, el.querySelector("img.cover").currentSrc)) return;
      const logo = document.createElement("img");
      logo.className = "logo";
      pc.append(logo);
      if (!await loadImg(logo, `/art/${id}/logo`, `${CDN}/logo.png`)) pc.append(div("title", el.querySelector(".name").textContent));
    })());
    return pc;
  }

  // Side B: name, developer and publisher, year and genres, the store's
  // popular user tags, description and optional QR.
  function backCard(id, el, opts) {
    const d = DETAILS[id] || {};
    const pc = div("pcard back");
    pc.append(div("name", el.querySelector(".name").textContent));
    const credits = div("credits");
    const credit = (label, who) => {
      const line = document.createElement("div");
      line.append(Object.assign(document.createElement("b"), { textContent: label + ": " }), who);
      credits.append(line);
    };
    if (d.developer && d.developer === d.publisher) credit("Developer & publisher", d.developer);
    else {
      if (d.developer) credit("Developer", d.developer);
      if (d.publisher) credit("Publisher", d.publisher);
    }
    pc.append(credits);
    pc.append(div("meta", [d.year, (d.genres || []).slice(0, 3).join(", ")].filter(Boolean).join(" · ")));
    const tags = div("tags");
    for (const t of d.tags || []) tags.append(Object.assign(document.createElement("span"), { textContent: t }));
    pc.append(tags, div("desc", d.description || ""));
    if (opts.qr) {
      const qr = div("qr");
      qr.innerHTML = el.querySelector(".qr").innerHTML;
      pc.append(qr);
    }
    return pc;
  }

  function newSheet(t) {
    const sheet = div("sheet" + (t.cutlines ? " cutlines" : "") + (t.mono ? " mono" : ""));
    Object.assign(sheet.style, {
      width: t.page[0], height: t.page[1], padding: t.margin || "0", gap: t.gap,
      gridTemplateColumns: `repeat(${t.cols}, ${t.card[0]})`, gridTemplateRows: `repeat(${t.rows}, ${t.card[1]})`,
      placeContent: t.center ? "center" : "start",
    });
    return sheet;
  }

  // Puts a card in its cell. On landscape stock the portrait card is turned
  // by `turn` degrees to fit.
  function place(sheet, card, t, row, col, pad, turn) {
    const cell = div("cell");
    cell.style.gridRow = row + 1;
    cell.style.gridColumn = col + 1;
    if (pad) card.style.padding = pad;
    Object.assign(card.style, t.rotate
      ? { position: "absolute", width: t.card[1], height: t.card[0], left: "50%", top: "50%", transform: `translate(-50%, -50%) rotate(${turn}deg)` }
      : { position: "relative", width: "100%", height: "100%" });
    cell.append(card);
    sheet.append(cell);
  }

  // Builds the sheets for the chosen template and sides. With both sides,
  // each side A sheet is followed by its side B, mirrored left-to-right so
  // cards line up when the printer flips on the long edge.
  function buildPrint(apps = APPS) {
    const t = TEMPLATES[$("template").value];
    const sides = $("sides").value;
    const opts = { qr: $("showQR").checked };
    $("page-style").textContent = `@page { size: ${t.page[0]} ${t.page[1]}; margin: 0; }`;
    const root = $("print-root");
    root.replaceChildren();
    root.classList.toggle("rounded", $("rounded").checked);
    const waits = [];
    if (sides === "ab" && $("oneSheet").checked) {
      // Each card's side A and side B sit in consecutive cells, both facing
      // the same way, to be cut out and glued back to back.
      const perSheet = Math.floor(t.cols * t.rows / 2);
      for (let i = 0; i < apps.length; i += perSheet) {
        const sheet = newSheet(t);
        apps.slice(i, i + perSheet).forEach(({ id }, n) => {
          const el = cardEls[id], a = 2 * n, b = a + 1;
          place(sheet, artCard(id, el, opts, waits), t, Math.floor(a / t.cols), a % t.cols, null, -90);
          place(sheet, backCard(id, el, opts), t, Math.floor(b / t.cols), b % t.cols, t.pad, -90);
        });
        root.append(sheet);
      }
      return Promise.all(waits);
    }
    const perSheet = t.cols * t.rows;
    for (let i = 0; i < apps.length; i += perSheet) {
      const batch = apps.slice(i, i + perSheet);
      const front = newSheet(t), back = newSheet(t);
      batch.forEach(({ id }, n) => {
        const el = cardEls[id], row = Math.floor(n / t.cols), col = n % t.cols;
        // Turned cards face opposite ways on each side, so after a long-edge
        // flip both sides are upright on the same edge.
        if (sides.includes("a")) place(front, artCard(id, el, opts, waits), t, row, col, null, -90);
        if (sides.includes("b")) place(back, backCard(id, el, opts), t, row, sides === "ab" ? t.cols - 1 - col : col, t.pad, sides === "ab" ? 90 : -90);
      });
      if (sides.includes("a")) root.append(front);
      if (sides.includes("b")) root.append(back);
    }
    return Promise.all(waits);
  }
  async function printCards(apps, button) {
    button.disabled = true;
    try { await buildPrint(apps); window.print(); } finally { button.disabled = false; }
  }
  $("print").addEventListener("click", () => printCards(APPS, $("print")));
  window.addEventListener("beforeprint", () => { if (!$("print-root").children.length) buildPrint(); });
  window.addEventListener("afterprint", () => $("print-root").replaceChildren());

  if (NFC) {
    document.getElementById("cancel-link").addEventListener("click", () => api("cancel", {}));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && pending) api("cancel", {}); });
    api();
    setInterval(api, 1000);
  }
</script>
</body>
</html>
