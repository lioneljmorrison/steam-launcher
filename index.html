<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardtridge™</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/print.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #1b2838; color: #c7d5e0; margin: 0; padding: 24px; }
  h1 { margin: 0; color: #fff; }
  h1 .tm { font-size: .45em; font-weight: 600; vertical-align: super; }
  .grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { position: relative; background: #fff; color: #111; border-radius: 10px; overflow: hidden; text-align: center; }
  .card img.cover { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; display: block; background: #2a475e; }
  .card .name { font-weight: 600; padding: 10px 10px 2px; }
  /* The QR code stays hidden until the QR button shows it over the card. */
  /* Padded clear of the store badge and tool buttons, and scaled to fit the card. */
  .card .qr { display: none; position: absolute; inset: 0; z-index: 1; box-sizing: border-box; padding: 48px 12px 12px; background: #fff; align-items: center; justify-content: center; cursor: pointer; }
  .card.show-qr .qr { display: flex; }
  .card .qr svg { width: auto; height: 100%; max-width: 100%; max-height: 180px; aspect-ratio: 1; display: block; }
  .card.show-qr .store { display: none; }
  /* The tools are one pill, like YouTube's volume control: just Play until
     it's hovered or focused, when the other buttons slide out to its left.
     It stays open while the QR code shows, so its button can close it. */
  .card .tools { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; flex-direction: row-reverse; align-items: center; padding: 3px; border-radius: 99px; background: rgba(15,25,34,.75); }
  .card .tools .more { display: flex; gap: 4px; max-width: 0; margin-right: 0; overflow: hidden; opacity: 0; transition: max-width .25s ease, margin-right .25s ease, opacity .2s ease; }
  .card .tools:hover .more, .card .tools:focus-within .more, .card.show-qr .tools .more { max-width: 112px; margin-right: 4px; opacity: 1; }
  .card .tools button { flex: none; width: 32px; height: 32px; padding: 6px; border-radius: 99px; background: transparent; display: grid; place-items: center; }
  @media (prefers-reduced-motion: reduce) { .card .tools .more { transition: none; } }
  .card .tools button:hover, .card.show-qr .tools .show-qr { background: #3d6c8d; }
  .card.custom-art .tools .pick-art { background: #66c0f4; color: #0f1922; }

  /* Art picker for the printed side A. */
  #art-dlg { width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-sizing: border-box; padding: 20px; border: 0; border-radius: 12px; background: #1b2838; color: #c7d5e0; }
  #art-dlg::backdrop { background: rgba(0,0,0,.6); }
  #art-dlg h2 { margin: 0 0 14px; color: #fff; font-size: 18px; }
  .art-body { display: flex; gap: 20px; align-items: flex-start; }
  .art-list { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: calc(100vh - 200px); overflow: auto; padding: 4px; }
  .art-list button { display: flex; flex-direction: column; gap: 4px; padding: 6px; background: #0f1922; border: 2px solid transparent; text-align: left; font-size: 11px; line-height: 1.3; }
  .art-list .tile { position: relative; display: grid; }
  .art-list .tile[hidden] { display: none; }
  .art-list button.del { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 99px; background: rgba(15,25,34,.85); color: #fff; font-size: 16px; line-height: 1; display: grid; place-items: center; }
  .art-list button.del:hover { background: #c94b4b; }
  .art-list button:hover { background: #2a475e; }
  .art-list button[aria-pressed="true"] { border-color: #66c0f4; }
  .art-list img { width: 100%; height: 120px; object-fit: contain; background: #000; border-radius: 4px; }
  .art-list .res { opacity: .75; }
  .art-list .q { display: inline-block; padding: 0 6px; border-radius: 99px; font-weight: 700; color: #0f1922; }
  .q.sharp { background: #75b022; } .q.ok { background: #e8a33d; } .q.soft { background: #c94b4b; color: #fff; }
  .art-list .note { grid-column: 1 / -1; opacity: .7; font-size: 13px; }
  .art-side { flex: none; width: 220px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .art-preview { position: relative; width: 220px; overflow: hidden; border-radius: 8px; background: #111; touch-action: none; user-select: none; }
  .art-preview.movable { cursor: grab; }
  .art-preview.dragging { cursor: grabbing; }
  .art-preview .pcard { position: absolute; inset: 0; }
  .art-preview img { -webkit-user-drag: none; }
  .art-preview img.logo, .art-preview .title { cursor: move; }
  .art-logo-row { display: flex; align-items: center; gap: 8px; }
  .art-logo-row button { padding: 2px 8px; font-size: 12px; }
  .art-side label { cursor: pointer; }
  .art-zoom { display: flex; align-items: center; gap: 6px; }
  .art-zoom button { width: 28px; padding: 4px 0; font-weight: 700; }
  .art-zoom input { flex: 1; min-width: 0; accent-color: #66c0f4; }
  .art-zoom output { width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .art-side .q { display: inline-block; padding: 0 6px; border-radius: 99px; font-weight: 700; color: #0f1922; }
  #art-dlg.dropping { outline: 3px dashed #66c0f4; outline-offset: -10px; }
  .art-actions { display: flex; gap: 8px; margin-top: 16px; }
  .art-actions button { padding: 8px 16px; }
  .art-actions #art-save { background: #5c7e10; }
  .art-actions #art-save:hover { background: #75b022; }
  .art-actions .spacer { flex: 1; }
  @media (max-width: 640px) { .art-body { flex-direction: column-reverse; } .art-side { width: 100%; } }
  .card .tools svg { width: 18px; height: 18px; }
  .card .tools .play { background: #5c7e10; }
  .card .tools .play:hover { background: #75b022; }
  .card .tools .play:disabled { opacity: .6; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 5; transform: translateX(-50%); padding: 10px 18px; border-radius: 99px; background: #1b2838; color: #fff; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .toast.error { background: #b23b3b; }
  .card.filtered { display: none; }
  .card .store { position: absolute; top: 8px; left: 8px; z-index: 2; padding: 2px 8px; border-radius: 99px; background: #7a3fbf; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .card .store.epic { background: #2a2a2a; }
  .card .meta { font-size: 12px; opacity: .65; padding: 0 10px 12px; }
  .card .meta:empty { display: none; }
  .card .desc { display: none; } /* labels only */
  .card .links { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 10px 12px; }
  .card .links:empty { display: none; }
  .card .link { display: inline-flex; align-items: center; gap: 4px; background: #e7eef4; border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12px; }
  .card .link code { font-size: 12px; }
  .card .link svg { width: 14px; height: 14px; color: #1b2838; flex: none; }
  .card .link button { background: transparent; color: #555; padding: 0 6px; border-radius: 99px; line-height: 18px; }
  .card .link button:hover { background: #c94b4b; color: #fff; }
  body.linking .card { cursor: pointer; outline: 3px solid transparent; transition: outline-color .15s; }
  body.linking .card:hover { outline-color: #e8a33d; }
  .banner { display: none; margin: 0 0 20px; padding: 14px 18px; border-radius: 10px; background: #e8a33d; color: #1b2838; font-weight: 600; }
  body.linking .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .banner code { font-size: 15px; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; background: #2a475e; color: #fff; }
  button:hover { background: #3d6c8d; }
  .muted { opacity: .7; }
  header { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin: 0 0 24px; }
  .header-actions { display: flex; gap: 8px; flex: none; }
  header button { padding: 8px 16px; }

  select, input[type=search] { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid #3d6c8d; background: #0f1922; color: #fff; }
  input[type=search] { width: 220px; }

  /* Search, letter jump and selection. */
  .finder { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 16px; }
  .letters { display: flex; flex-wrap: wrap; gap: 4px; }
  .letters button { min-width: 30px; padding: 4px 6px; background: #0f1922; border: 1px solid #2a475e; }
  .letters button:hover { background: #2a475e; }
  .letters button[aria-pressed="true"] { background: #66c0f4; border-color: #66c0f4; color: #0f1922; font-weight: 700; }
  .empty { display: none; padding: 32px; text-align: center; opacity: .7; }
  .empty.show { display: block; }
  .card.selected { box-shadow: 0 0 0 4px #66c0f4; }
  .card.selected::after { content: "✓"; position: absolute; left: 8px; bottom: 8px; z-index: 2; width: 24px; height: 24px; border-radius: 99px; background: #66c0f4; color: #0f1922; font-weight: 800; display: grid; place-items: center; }
  #clear-selection { display: none; margin-left: 0; }
  body.has-selection #clear-selection { display: inline-block; }

  /* Printing builds #print-root from the template's sheet geometry (see TEMPLATES). */
  #print-root { display: none; }
  @media print {
    html, body { background: #fff; padding: 0; margin: 0; }
    body > :not(#print-root) { display: none !important; }
    #print-root { display: block; }
  }
  .sheet { box-sizing: border-box; overflow: hidden; display: grid; break-after: page; }
  .sheet:last-child { break-after: auto; }
  /* Cards print portrait. On landscape stock (Avery, labels) each card is turned
     90° inside its cell; see place(). */
  .cell { position: relative; overflow: hidden; contain: strict; } /* without it Chrome misplaces turned cards on multi-page prints */
  .pcard { box-sizing: border-box; overflow: hidden; background: #fff; color: #000; font-family: system-ui, sans-serif; }
  /* Side A: the portrait library art. */
  .pcard.art { padding: 0 !important; background: #111; }
  .pcard.art img.hero { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pcard.art img.logo { position: absolute; left: 8%; right: 8%; bottom: 8%; width: 84%; height: 30%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 0.5mm 1.2mm rgba(0,0,0,.6)); }
  .pcard.art .title { position: absolute; left: 3mm; right: 3mm; bottom: 4mm; color: #fff; font-size: 12pt; font-weight: 700; text-align: center; text-shadow: 0 0.3mm 1.5mm #000; }
  /* Side B: details, tags and optional QR. */
  .pcard.back { display: flex; flex-direction: column; gap: 1.2mm; }
  .pcard.back .name { font-size: 11pt; font-weight: 700; line-height: 1.15; }
  .pcard.back .credits { font-size: 6.5pt; line-height: 1.35; }
  .pcard.back .credits b { font-weight: 600; }
  .pcard.back .meta { font-size: 6.5pt; opacity: .8; }
  .pcard.back .tags { display: flex; flex-wrap: wrap; gap: 0.8mm; }
  .pcard.back .tags span { font-size: 5.5pt; line-height: 1; padding: 0.6mm 1.2mm; border: 0.2mm solid #000; border-radius: 1mm; white-space: nowrap; }
  .pcard.back .desc { flex: 1; min-height: 0; font-size: 6pt; line-height: 1.3; overflow: hidden; }
  .pcard.back .qr { flex: none; align-self: center; }
  .pcard.back .qr svg { width: 24mm; height: 24mm; display: block; }
  .pcard.back > :empty { display: none; }
  .sheet.cutlines .cell { border: 0.2mm dashed #9aa; }
  #print-root.rounded .cell { border-radius: 3.18mm; } /* the standard 1/8 in card corner */
  .sheet.mono img { filter: grayscale(1) contrast(1.15); }

  .print-bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 0 0 20px; padding: 10px 14px; border: 1px solid #2a475e; border-radius: 10px; font-size: 14px; }
  .print-bar .title { color: #fff; font-weight: 600; }
  .print-bar a { color: #66c0f4; }
  .print-bar button { padding: 8px 16px; margin-left: auto; }

  /* The print bar and finder stick to the top once scrolled past, trimmed to
     their buttons. Above the card tools (z-index 2), below the toast. */
  .toolbar { position: sticky; top: 0; z-index: 3; margin: 0 -24px; padding: 0 24px; background: #1b2838; }
  .toolbar.stuck { padding-top: 10px; padding-bottom: 10px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .toolbar.stuck .print-bar { margin-bottom: 8px; padding: 6px 10px; }
  .toolbar.stuck .print-bar button { padding: 6px 14px; }
  .toolbar.stuck .finder { margin-bottom: 0; }
  .toolbar.stuck #print-summary, .toolbar.stuck .print-bar a, .toolbar.stuck .finder .muted { display: none; }
  .toolbar.stuck .banner { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<header>
  <div>
    <h1>Cardtridge<span class="tm">™</span></h1>
  </div>
  <div class="header-actions">
    <select id="store" aria-label="Show games from" title="Show games from">
      <option value="all">All</option>
      <option value="steam">Steam</option>
      <option value="gog">GOG</option>
      <option value="epic">Epic</option>
    </select>
    <button onclick="location.href='/settings'">Settings</button>
  </div>
</header>
<div class="toolbar-sentinel" id="toolbar-sentinel"></div>
<div class="toolbar" id="toolbar">
<div class="banner" id="banner">
  <span>New card <code id="pending-uid"></code> on the base — click a game to link it.</span>
  <button id="cancel-link" title="Forget this card (Esc)">Cancel</button>
</div>
<section class="print-bar" aria-label="Print settings">
  <span class="title">Print</span>
  <span id="print-summary"></span>
  <a href="/settings#printing" title="Change the template, sides and other print settings">Change</a>
  <button id="print" title="Print the games shown, at 100% scale with margins set to None or Default">Print cards</button>
  <button id="clear-selection" title="Clear the selection (Esc)">Clear selection</button>
</section>
<section class="finder" aria-label="Find games">
  <input type="search" id="search" placeholder="Search games (Ctrl+K)" aria-label="Search games" autocomplete="off">
  <div class="letters" id="letters" role="group" aria-label="Jump to games starting with"></div>
  <span class="muted">Ctrl+click cards to select them for printing.</span>
</section>
</div>
<div id="toolbar-spacer"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">No games match.</div>
<dialog id="art-dlg" aria-labelledby="art-title">
  <h2 id="art-title">Print art for <span id="art-name"></span></h2>
  <div class="art-body">
    <div class="art-list" id="art-list"></div>
    <div class="art-side">
      <div class="art-preview" id="art-preview" title="Drag the art to choose what stays in view when it's cropped to the card"></div>
      <span class="muted">Side A as it prints on the chosen template. Drag the art to choose what stays in view; zoom in to crop closer.</span>
      <div class="art-zoom" role="group" aria-label="Zoom">
        <button type="button" id="art-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <input type="range" id="art-zoom" min="1" max="4" step="0.05" value="1" aria-label="Zoom">
        <button type="button" id="art-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <output id="art-zoom-val" for="art-zoom">1.0×</output>
      </div>
      <span id="art-dpi" class="muted"></span>
      <div class="art-logo-row">
        <label><input type="checkbox" id="art-logo"> Game logo over the art</label>
        <button type="button" id="art-logo-reset" title="Put the logo back along the bottom" hidden>Reset</button>
      </div>
      <span class="muted">Drag the logo to move it.</span>
      <button type="button" id="art-upload" title="Use an image from this PC; you can also drop one on this window">Upload an image…</button>
      <input type="file" id="art-file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>
  </div>
  <div class="art-actions">
    <button type="button" id="art-auto" title="Let the app choose the art again">Use automatic art</button>
    <span class="spacer"></span>
    <button type="button" id="art-cancel">Cancel</button>
    <button type="button" id="art-save">Save</button>
  </div>
</dialog>
<div id="print-root"></div>
<style id="page-style"></style>
<script>
  const APPS = {{.Apps}};
  const BASE = {{.Base}};
  const KEY = {{.Key}};
  const NFC = {{.NFC}};
  const DETAILS = {{.Details}};
  let ART = {{.Art}}; // art picked for side A, by appid
  const grid = document.getElementById("grid");
  const cardEls = {};
  let pending = null;
  const ICON_QR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 20h4v-3"/></svg>`;
  const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>`;
  const ICON_IMAGE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>`;
  const ICON_PRINT =`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="6" y="14" width="12" height="7"/></svg>`;

  for (const { id, name, store } of APPS) {
    const url = `${BASE}/launch/${id}?k=${encodeURIComponent(KEY)}`;
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.store = store;
    const cdn = store === "steam" ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg` : "";
    card.innerHTML = `
      <img class="cover" src="/cover/${id}" data-cdn="${cdn}"
        onerror="if (this.dataset.cdn) { this.src = this.dataset.cdn; this.dataset.cdn = ''; } else this.style.visibility = 'hidden'">
      ${store === "gog" ? `<span class="store" title="GOG game: runs its exe directly">GOG</span>` : ""}
      ${store === "epic" ? `<span class="store epic" title="Epic game: starts through the Epic Games Launcher">EPIC</span>` : ""}
      <div class="tools">
        <button class="play" title="Play on this PC" aria-label="Play on this PC">${ICON_PLAY}</button>
        <div class="more">
          <button class="show-qr" title="Show QR code" aria-label="Show QR code">${ICON_QR}</button>
          <button class="pick-art" title="Choose the printed art" aria-label="Choose the printed art">${ICON_IMAGE}</button>
          <button class="print-one" title="Print this card" aria-label="Print this card">${ICON_PRINT}</button>
        </div>
      </div>
      <div class="qr" title="Click to hide">${qr.createSvgTag({ scalable: true, margin: 2 })}</div>
      <div class="name"></div>
      <div class="meta"></div>
      <div class="desc"></div>
      <div class="links"></div>`;
    card.querySelector(".name").textContent = name;
    const d = DETAILS[id];
    if (d) {
      card.querySelector(".meta").textContent = [d.developer, d.year, (d.genres || []).slice(0, 2).join(", ")].filter(Boolean).join(" · ");
      card.querySelector(".desc").textContent = d.description || "";
    }
    card.title = url;
    card.querySelector(".show-qr").addEventListener("click", e => {
      e.stopPropagation();
      card.classList.toggle("show-qr");
    });
    card.querySelector(".qr").addEventListener("click", e => {
      e.stopPropagation();
      card.classList.remove("show-qr");
    });
    card.querySelector(".play").addEventListener("click", e => {
      e.stopPropagation();
      play(id, e.currentTarget);
    });
    card.classList.toggle("custom-art", !!ART[id]);
    card.querySelector(".pick-art").addEventListener("click", e => {
      e.stopPropagation();
      pickArt(id);
    });
    card.querySelector(".print-one").addEventListener("click", e => {
      e.stopPropagation();
      // On a selected card it prints the whole selection.
      printCards(selected.has(id) ? printTargets() : [{ id }], e.currentTarget);
    });
    card.addEventListener("click", e => {
      if (e.ctrlKey || e.metaKey) return toggleSelected(id);
      if (pending) api("link", { uid: pending.uid, appid: id });
    });
    grid.appendChild(card);
    cardEls[id] = card;
  }

  let toastTimer;
  function toast(message, error) {
    const el = document.getElementById("toast");
    // An open dialog sits above the page, so the toast moves into it to be seen.
    const host = document.querySelector("dialog[open]") || document.body;
    if (el.parentElement !== host) host.append(el);
    el.textContent = message;
    el.classList.toggle("error", !!error);
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
  }

  async function play(id, button) {
    button.disabled = true;
    try {
      const res = await fetch(`/api/launch/${id}`, { method: "POST", headers: { "X-Key": KEY } });
      if (res.ok) toast((await res.json()).message);
      else toast((await res.text()).trim() || "Couldn't start the game.", true);
    } catch {
      toast("Couldn't reach the launcher.", true);
    } finally {
      setTimeout(() => { button.disabled = false; }, 2000);
    }
  }

  async function api(action, body) {
    const res = await fetch(action ? `/api/cards/${action}` : "/api/cards", {
      method: action ? "POST" : "GET",
      headers: { "X-Key": KEY, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.ok) render(await res.json());
  }

  function render({ pending: p, cards }) {
    pending = p;
    document.body.classList.toggle("linking", !!p);
    document.getElementById("pending-uid").textContent = p ? p.uid : "";

    const byApp = {};
    for (const c of cards) (byApp[c.appid] ||= []).push(c.uid);
    for (const [id, el] of Object.entries(cardEls)) {
      const uids = (byApp[id] || []).sort();
      const links = el.querySelector(".links");
      if (links.dataset.uids === uids.join()) continue; // unchanged; don't rebuild under the cursor
      links.dataset.uids = uids.join();
      links.replaceChildren(...uids.map(uid => {
        const chip = document.createElement("span");
        chip.className = "link";
        chip.title = "NFC card linked to this game";
        chip.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-label="NFC"><path d="M7 9a4.5 4.5 0 0 1 0 6"/><path d="M10.5 6a9 9 0 0 1 0 12"/><path d="M14 3a13.5 13.5 0 0 1 0 18"/></svg><code></code><button title="Unlink this card">×</button>`;
        chip.querySelector("code").textContent = uid;
        chip.querySelector("button").addEventListener("click", e => {
          e.stopPropagation();
          api("unlink", { uid });
        });
        return chip;
      }));
    }
  }

  // Filters: store (remembered in this browser), search text and first letter.
  // Names are folded so "É" files under E and "pokemon" finds "Pokémon".
  const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const folded = Object.fromEntries(APPS.map(({ id, name }) => [id, fold(name).trim()]));
  // A-Z and 0-9 each get a button; anything else shares the "#" button.
  const initial = id => /^[a-z0-9]/.test(folded[id]) ? folded[id][0].toUpperCase() : "#";
  const ORDER = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#"];
  const storeSel = document.getElementById("store");
  const search = document.getElementById("search");
  let letter = null;
  for (const opt of storeSel.options) {
    const n = opt.value === "all" ? APPS.length : APPS.filter(a => a.store === opt.value).length;
    opt.textContent += ` (${n})`;
  }
  try { if (["all", "steam", "gog", "epic"].includes(localStorage.getItem("store"))) storeSel.value = localStorage.getItem("store"); } catch {}
  function applyFilter() {
    const q = fold(search.value.trim());
    // Letter buttons show only for games that pass the store and search filters.
    const base = APPS.filter(({ id, store }) => (storeSel.value === "all" || store === storeSel.value) && folded[id].includes(q));
    const letters = new Set(base.map(({ id }) => initial(id)));
    if (letter && !letters.has(letter)) letter = null;
    const bar = document.getElementById("letters");
    bar.replaceChildren(...ORDER.filter(l => letters.has(l)).map(l => {
      const b = document.createElement("button");
      b.textContent = l;
      b.title = l === "#" ? "Games starting with a symbol" : `Games starting with ${l}`;
      b.setAttribute("aria-pressed", l === letter);
      b.addEventListener("click", () => { letter = letter === l ? null : l; toGridTop(); rearrange(applyFilter); });
      return b;
    }));
    const shown = new Set(base.filter(({ id }) => !letter || initial(id) === letter).map(({ id }) => id));
    for (const { id } of APPS) cardEls[id].classList.toggle("filtered", !shown.has(id));
    document.getElementById("empty").classList.toggle("show", !shown.size);
    try { localStorage.setItem("store", storeSel.value); } catch {}
  }
  // Once scrolled past, the toolbar sticks and slims down. A letter picked from
  // it brings the grid's top back under it, before the cards are measured.
  const toolbar = document.getElementById("toolbar");
  // The spacer takes up what the slimmed toolbar gives back, so the page below
  // doesn't move; otherwise scroll anchoring pulls the page up, unsticking it.
  const spacer = document.getElementById("toolbar-spacer");
  new IntersectionObserver(([e]) => {
    const full = toolbar.offsetHeight;
    toolbar.classList.toggle("stuck", !e.isIntersecting);
    spacer.style.height = e.isIntersecting ? "" : `${Math.max(0, full - toolbar.offsetHeight)}px`;
  }).observe(document.getElementById("toolbar-sentinel"));
  function toGridTop() {
    if (!toolbar.classList.contains("stuck")) return;
    scrollBy({ top: grid.getBoundingClientRect().top - toolbar.getBoundingClientRect().bottom - 16, behavior: "instant" });
  }
  storeSel.addEventListener("change", () => rearrange(applyFilter));
  search.addEventListener("input", () => rearrange(applyFilter));

  // Animates a filter change, Isotope style: cards that stay slide to their new
  // place, new ones grow in, and removed ones shrink out as ghost copies, since
  // the real card is already display: none. Only cards on screen animate.
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const MOTION = { duration: 350, easing: "cubic-bezier(.2, .8, .2, 1)" };
  let ghosts = [];
  function rearrange(change) {
    if (reduceMotion.matches) return change();
    ghosts.forEach(g => g.remove());
    ghosts = [];
    const cards = Object.values(cardEls);
    // Measured mid-flight too, so an interrupted move carries on from where it is.
    const first = new Map();
    for (const el of cards) if (!el.classList.contains("filtered")) first.set(el, el.getBoundingClientRect());
    for (const el of cards) el.getAnimations().forEach(a => a.cancel());
    change();
    const gridBox = grid.getBoundingClientRect();
    const onScreen = r => r.bottom > 0 && r.top < innerHeight;
    for (const el of cards) {
      const was = first.get(el), shown = !el.classList.contains("filtered");
      if (shown) {
        const now = el.getBoundingClientRect();
        if (!was) {
          if (onScreen(now)) el.animate([{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "none" }], MOTION);
        } else if ((onScreen(was) || onScreen(now)) && (was.left !== now.left || was.top !== now.top || was.width !== now.width)) {
          el.animate([
            { transformOrigin: "0 0", transform: `translate(${was.left - now.left}px, ${was.top - now.top}px) scale(${was.width / now.width}, ${was.height / now.height})` },
            { transformOrigin: "0 0", transform: "none" },
          ], MOTION);
        }
      } else if (was && onScreen(was)) {
        const g = el.cloneNode(true);
        g.classList.remove("filtered");
        g.removeAttribute("title");
        Object.assign(g.style, {
          position: "absolute", left: `${was.left - gridBox.left}px`, top: `${was.top - gridBox.top}px`,
          width: `${was.width}px`, height: `${was.height}px`, margin: 0, pointerEvents: "none",
        });
        grid.append(g);
        ghosts.push(g);
        g.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.6)" }], MOTION).onfinish = () => g.remove();
      }
    }
  }
  document.addEventListener("keydown", e => {
    if (artDlg.open) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      search.focus();
      search.select();
    }
  });
  applyFilter();
  const shownApps = () => APPS.filter(({ id }) => !cardEls[id].classList.contains("filtered"));

  // Ctrl+click selects cards to print. A selection prints even when a filter hides some of it.
  const selected = new Set();
  function toggleSelected(id) {
    if (!selected.delete(id)) selected.add(id);
    cardEls[id].classList.toggle("selected", selected.has(id));
    syncSelection();
  }
  function clearSelection() {
    for (const id of selected) cardEls[id].classList.remove("selected");
    selected.clear();
    syncSelection();
  }
  function syncSelection() {
    document.body.classList.toggle("has-selection", selected.size > 0);
    document.getElementById("print").textContent = selected.size ? `Print ${selected.size} selected` : "Print cards";
    for (const [id, el] of Object.entries(cardEls)) {
      const title = selected.has(id) && selected.size > 1 ? `Print the ${selected.size} selected cards` : "Print this card";
      el.querySelector(".print-one").title = title;
      el.querySelector(".print-one").setAttribute("aria-label", title);
    }
  }
  const printTargets = () => selected.size ? APPS.filter(({ id }) => selected.has(id)) : shownApps();
  document.getElementById("clear-selection").addEventListener("click", clearSelection);

  // Print settings are chosen in Settings and kept by the app (print.js has
  // the templates). Settings this browser kept before then are moved over once.
  const $ = id => document.getElementById(id);
  let saved = {{.Print}};
  if (!saved) {
    try {
      saved = JSON.parse(localStorage.getItem("printPrefs"));
      if (saved) fetch("/api/print", { method: "POST", headers: { "X-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify(normalizePrint(saved)) });
    } catch {}
  }
  const PRINT = normalizePrint(saved || {});
  $("print-summary").textContent = printSummary(PRINT);

  const loadImg = (img, ...srcs) => (async () => {
    for (const src of srcs) {
      img.src = src;
      try { await img.decode(); return true; } catch {}
    }
    img.remove();
    return false;
  })();

  function div(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    if (text) el.textContent = text;
    return el;
  }

  // Side A: the art picked for the game, or else the portrait library art.
  // Without that, the hero art with the logo over it, then the header art;
  // the name when there's no logo.
  function artCard(id, el, opts, waits, choice = ART[id]) {
    const pc = div("pcard art");
    const img = cls => pc.appendChild(Object.assign(document.createElement("img"), { className: cls }));
    // Steam art falls back to Steam's CDN; GOG art only comes via /art (a redirect to GOG's CDN).
    const CDN = `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}`;
    const cdn = (...files) => el.dataset.store === "steam" ? files.map(f => `${CDN}/${f}`) : [];
    const addLogo = async () => {
      const logo = img("logo");
      if (await loadImg(logo, `/art/${id}/logo`, ...cdn("logo.png"))) placeLogo(logo, choice?.logoPos);
      else placeLogo(pc.appendChild(div("title", el.querySelector(".name").textContent)), choice?.logoPos);
    };
    waits.push((async () => {
      if (choice) {
        const art = img("hero");
        if (await loadImg(art, choice.src)) {
          art.style.objectPosition = art.style.transformOrigin = choice.pos || "";
          // Zoom scales from the point kept in view, so panning still runs edge to edge.
          if (choice.zoom > 1) art.style.transform = `scale(${choice.zoom})`;
          if (choice.logo) await addLogo();
          return;
        }
      }
      // The CDN's 600 × 900 art comes first: the client usually caches only 300 × 450, which prints soft.
      if (await loadImg(img("hero"), ...cdn("library_600x900_2x.jpg"), `/art/${id}/capsule`, ...cdn("library_600x900.jpg"))) return;
      if (!await loadImg(img("hero"), `/art/${id}/hero`, ...cdn("library_hero.jpg"), `/art/${id}/header`, el.querySelector("img.cover").currentSrc)) return;
      await addLogo();
    })());
    return pc;
  }

  // placeLogo centres the logo (or the name standing in for it) on a point
  // of the card, "x% y%"; the name only moves up and down.
  function placeLogo(el, logoPos) {
    if (!logoPos) return;
    const [x, y] = logoPos.split(" ").map(parseFloat);
    if (el.matches("img.logo")) Object.assign(el.style, { left: `${x - 42}%`, top: `${y - 15}%`, right: "auto", bottom: "auto", objectPosition: "center" });
    else Object.assign(el.style, { top: `${y}%`, bottom: "auto", transform: "translateY(-50%)" });
  }

  // The card's portrait size in inches on the chosen template; turned cards
  // swap the cell's sides.
  function cardInches() {
    const t = TEMPLATES[PRINT.template];
    const [w, h] = t.card.map(s => parseFloat(s) / (s.endsWith("mm") ? 25.4 : 1));
    return t.rotate ? [h, w] : [w, h];
  }

  // How sharp art prints at a dpi, as a badge.
  function qualityBadge(dpi) {
    const [q, word] = dpi >= 250 ? ["sharp", "Sharp"] : dpi >= 150 ? ["ok", "OK"] : ["soft", "Blurry"];
    return `<span class="q ${q}">${word}</span>`;
  }

  // The art picker: every image the game has, with how sharp it prints at the
  // template's card size (cropped to fill it), and a preview of side A.
  const artDlg = $("art-dlg");
  let picking = null; // { id, choice } while the picker is open
  async function pickArt(id) {
    const el = cardEls[id];
    picking = { id, choice: ART[id] ? { ...ART[id] } : null };
    $("art-name").textContent = el.querySelector(".name").textContent;
    const [cw, ch] = cardInches();
    $("art-preview").style.aspectRatio = `${cw} / ${ch}`;
    const list = $("art-list");
    list.replaceChildren(div("note", "Loading images…"));
    artDlg.showModal();
    showPreview();
    const seen = new Map(); // src → its tile
    // add lists an image, first after the note or else last. Uploads can be deleted.
    const add = ({ src, label }, first) => {
      if (seen.has(src)) return;
      const tile = div("tile");
      tile.hidden = true; // until the image loads
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.src = src;
      tile.append(b);
      if (src.startsWith(`/art/${id}/upload?`)) {
        const del = Object.assign(document.createElement("button"), { type: "button", className: "del", textContent: "×", title: "Delete this upload" });
        del.setAttribute("aria-label", "Delete this upload");
        del.addEventListener("click", async () => {
          if (await deleteUpload(src)) {
            tile.remove();
            seen.delete(src);
          }
        });
        tile.append(del);
      }
      const im = document.createElement("img");
      const res = div("res");
      b.append(im, div("", label), res);
      im.onload = () => {
        const dpi = Math.round(Math.min(im.naturalWidth / cw, im.naturalHeight / ch));
        res.innerHTML = `${im.naturalWidth} × ${im.naturalHeight} · ${qualityBadge(dpi)}`;
        res.title = `About ${dpi} dpi on this card`;
        tile.hidden = false;
      };
      im.onerror = () => { tile.remove(); seen.delete(src); };
      im.src = src;
      b.setAttribute("aria-pressed", picking.choice?.src === src);
      b.addEventListener("click", () => choose(src, $("art-logo").checked));
      seen.set(src, tile);
      const note = list.querySelector(".note");
      if (first && note) note.after(tile);
      else list.append(tile);
    };
    picking.add = add;
    const get = async path => {
      try {
        const res = await fetch(path, { headers: { "X-Key": KEY } });
        return res.ok ? await res.json() : [];
      } catch { return []; }
    };
    const candidates = await get(`/api/art/${id}`);
    if (picking?.id !== id) return;
    seen.clear();
    list.replaceChildren(div("note", "Pick the art for side A, or upload your own. The badge is how sharp it prints filling this card: Sharp is 250 dpi or more, OK is 150 to 250, Blurry is under 150. Hover a badge for its dpi."));
    if (picking.choice) add({ src: picking.choice.src, label: "Current choice" });
    candidates.forEach(add);
    if (el.dataset.store === "steam") {
      const shots = await get(`/api/art/${id}/screenshots`);
      if (picking?.id === id) shots.forEach(add);
    }
  }

  // choose makes an image the choice, filling the card from its middle. A
  // logo that was moved stays where it was put.
  function choose(src, logo) {
    const logoPos = picking.choice?.logoPos;
    picking.choice = { src, pos: "", logo, ...(logoPos && { logoPos }) };
    for (const o of $("art-list").querySelectorAll("button[data-src]")) o.setAttribute("aria-pressed", o.dataset.src === src);
    showPreview();
  }

  function showPreview() {
    const box = $("art-preview"), waits = [];
    $("art-logo").checked = !!picking.choice?.logo;
    $("art-logo-reset").hidden = !(picking.choice?.logo && picking.choice.logoPos);
    box.replaceChildren(artCard(picking.id, cardEls[picking.id], {}, waits, picking.choice));
    box.classList.toggle("movable", !!picking);
    showZoom();
    const id = picking.id;
    Promise.all(waits).then(() => { if (picking?.id === id) showZoom(); });
  }

  // showZoom shows the zoom and how sharp the art prints at it: zooming in
  // spreads fewer of the image's pixels over the card.
  function showZoom() {
    const zoom = picking.choice?.zoom || 1;
    $("art-zoom").value = zoom;
    $("art-zoom-val").textContent = `${zoom.toFixed(1)}×`;
    const art = $("art-preview").querySelector("img.hero"), [cw, ch] = cardInches();
    if (!art?.naturalWidth) return $("art-dpi").textContent = "";
    const dpi = Math.round(Math.min(art.naturalWidth / cw, art.naturalHeight / ch) / zoom);
    $("art-dpi").innerHTML = `Prints at about ${dpi} dpi · ${qualityBadge(dpi)}`;
  }

  function setZoom(zoom) {
    if (!picking || !adoptShown()) return;
    zoom = Math.min(4, Math.max(1, Math.round(zoom * 100) / 100));
    if (zoom > 1) picking.choice.zoom = zoom;
    else delete picking.choice.zoom;
    const art = $("art-preview").querySelector("img.hero");
    if (art) art.style.transform = zoom > 1 ? `scale(${zoom})` : "";
    showZoom();
  }
  $("art-zoom").addEventListener("input", e => setZoom(+e.target.value));
  $("art-zoom-in").addEventListener("click", () => setZoom((picking?.choice?.zoom || 1) + 0.25));
  $("art-zoom-out").addEventListener("click", () => setZoom((picking?.choice?.zoom || 1) - 0.25));
  $("art-preview").addEventListener("wheel", e => {
    if (!picking) return;
    e.preventDefault();
    setZoom((picking.choice?.zoom || 1) * Math.exp(-e.deltaY * 0.002));
  }, { passive: false });

  // deleteUpload removes an uploaded image from this PC, after asking; a game
  // saved with it goes back to automatic art. True once it's gone.
  async function deleteUpload(src) {
    if (!confirm("Delete this uploaded image from this PC?")) return false;
    const id = picking.id, name = new URL(src, location.href).searchParams.get("f");
    try {
      const res = await fetch(`/api/art/${id}/upload?f=${encodeURIComponent(name)}`, { method: "DELETE", headers: { "X-Key": KEY } });
      if (!res.ok) throw new Error((await res.text()).trim());
      const wasSaved = ART[id]?.src === src;
      ART = await res.json();
      cardEls[id].classList.toggle("custom-art", !!ART[id]);
      if (picking?.id === id && picking.choice?.src === src) {
        picking.choice = null;
        showPreview();
      }
      toast(wasSaved ? "Deleted the upload. This game is back to automatic art." : "Deleted the upload.");
      return true;
    } catch (err) {
      toast(`Couldn't delete the upload: ${err.message}`, true);
      return false;
    }
  }

  // Uploads are stored on this PC, listed first and chosen with the logo
  // over them, since bare art is usually what gets uploaded.
  async function uploadArt(file) {
    if (!picking || !file) return;
    const id = picking.id;
    try {
      const res = await fetch(`/api/art/${id}/upload`, {
        method: "POST",
        headers: { "X-Key": KEY, "Content-Type": "application/octet-stream" },
        body: file,
      });
      if (!res.ok) throw new Error((await res.text()).trim());
      const c = await res.json();
      if (picking?.id !== id) return;
      picking.add(c, true);
      choose(c.src, true);
    } catch (err) {
      toast(`Couldn't upload the image: ${err.message}`, true);
    }
  }
  $("art-upload").addEventListener("click", () => $("art-file").click());
  $("art-file").addEventListener("change", e => {
    uploadArt(e.target.files[0]);
    e.target.value = "";
  });
  const hasFiles = e => e.dataTransfer?.types.includes("Files");
  artDlg.addEventListener("dragover", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    artDlg.classList.add("dropping");
  });
  artDlg.addEventListener("dragleave", e => { if (!artDlg.contains(e.relatedTarget)) artDlg.classList.remove("dropping"); });
  artDlg.addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    artDlg.classList.remove("dropping");
    uploadArt(e.dataTransfer.files[0]);
  });

  // On automatic art, the art the preview shows becomes the choice when it's
  // moved or given a logo, kept as it looks now. False while it's loading.
  function adoptShown() {
    if (picking.choice) return true;
    const box = $("art-preview"), art = box.querySelector("img.hero");
    if (!art?.naturalWidth) return false;
    picking.choice = { src: art.getAttribute("src"), pos: "", logo: !!box.querySelector("img.logo, .title") };
    $("art-logo").checked = picking.choice.logo;
    for (const o of $("art-list").querySelectorAll("button[data-src]")) o.setAttribute("aria-pressed", o.dataset.src === picking.choice.src);
    return true;
  }

  // Dragging the preview pans the picked art inside the card. The art is
  // cropped to fill it, so it moves only along the side that overflows, by
  // object-position: 0% shows one edge of the image, 100% the other.
  // Dragging the logo moves its middle around the card, keeping it all on
  // the card.
  let drag = null;
  $("art-preview").addEventListener("pointerdown", e => {
    const art = e.currentTarget.querySelector("img.hero");
    if (!picking || !adoptShown()) return;
    const box = e.currentTarget.getBoundingClientRect();
    const logo = e.target.closest("img.logo, .title");
    let r, w, h, cy;
    if (logo) {
      r = logo.getBoundingClientRect();
      // The logo image fits inside its box, along the bottom until it's moved.
      [w, h, cy] = [r.width, r.height, r.top + r.height / 2];
      if (logo.matches("img.logo")) {
        const ar = logo.naturalWidth / logo.naturalHeight;
        w = Math.min(r.width, r.height * ar);
        h = w / ar;
        if (!picking.choice.logoPos) cy = r.bottom - h / 2;
      }
    }
    // Only the logo itself grabs it; around it, the art pans.
    if (logo && Math.abs(e.clientX - (r.left + r.width / 2)) <= w / 2 && Math.abs(e.clientY - cy) <= h / 2) {
      drag = {
        logo, box, startX: e.clientX, startY: e.clientY,
        x: (r.left + r.width / 2 - box.left) / box.width * 100, y: (cy - box.top) / box.height * 100,
        halfW: w / 2 / box.width * 100, halfH: h / 2 / box.height * 100,
      };
      e.currentTarget.setPointerCapture(e.pointerId);
      e.currentTarget.classList.add("dragging");
      e.preventDefault();
      return;
    }
    const scale = Math.max(box.width / art.naturalWidth, box.height / art.naturalHeight) * (picking.choice.zoom || 1);
    const [x, y] = (picking.choice.pos || "50% 50%").split(" ").map(parseFloat);
    drag = {
      art, x, y, startX: e.clientX, startY: e.clientY,
      // How far the image overflows the card on each side, in screen pixels.
      overX: art.naturalWidth * scale - box.width, overY: art.naturalHeight * scale - box.height,
    };
    e.currentTarget.setPointerCapture(e.pointerId);
    e.currentTarget.classList.add("dragging");
    e.preventDefault();
  });
  $("art-preview").addEventListener("pointermove", e => {
    if (!drag) return;
    if (drag.logo) {
      const clamp = (v, half) => Math.min(100 - half, Math.max(half, v));
      const x = clamp(drag.x + (e.clientX - drag.startX) / drag.box.width * 100, drag.halfW);
      const y = clamp(drag.y + (e.clientY - drag.startY) / drag.box.height * 100, drag.halfH);
      picking.choice.logoPos = `${Math.round(x * 10) / 10}% ${Math.round(y * 10) / 10}%`;
      placeLogo(drag.logo, picking.choice.logoPos);
      $("art-logo-reset").hidden = false;
      return;
    }
    const pan = (start, delta, over) => over < 1 ? start : Math.min(100, Math.max(0, start - delta / over * 100));
    const x = pan(drag.x, e.clientX - drag.startX, drag.overX), y = pan(drag.y, e.clientY - drag.startY, drag.overY);
    picking.choice.pos = `${Math.round(x * 10) / 10}% ${Math.round(y * 10) / 10}%`;
    drag.art.style.objectPosition = drag.art.style.transformOrigin = picking.choice.pos;
  });
  const endDrag = e => {
    drag = null;
    e.currentTarget.classList.remove("dragging");
  };
  $("art-preview").addEventListener("pointerup", endDrag);
  $("art-preview").addEventListener("pointercancel", endDrag);
  $("art-logo").addEventListener("change", () => {
    const logo = $("art-logo").checked;
    if (!adoptShown()) return $("art-logo").checked = false;
    picking.choice.logo = logo;
    showPreview();
  });
  $("art-logo-reset").addEventListener("click", () => {
    delete picking.choice.logoPos;
    showPreview();
  });
  async function saveArt(choice) {
    const id = picking.id;
    try {
      const res = await fetch(`/api/art/${id}`, {
        method: "POST",
        headers: { "X-Key": KEY, "Content-Type": "application/json" },
        body: JSON.stringify(choice || {}),
      });
      if (!res.ok) throw new Error((await res.text()).trim());
      ART = await res.json();
      cardEls[id].classList.toggle("custom-art", !!ART[id]);
      artDlg.close();
      toast(choice ? "Saved the print art." : "Back to automatic art.");
    } catch (err) {
      toast(`Couldn't save the art: ${err.message}`, true);
    }
  }
  $("art-save").addEventListener("click", () => saveArt(picking.choice));
  $("art-auto").addEventListener("click", () => saveArt(null));
  $("art-cancel").addEventListener("click", () => artDlg.close());
  artDlg.addEventListener("close", () => { picking = null; artDlg.classList.remove("dropping"); });

  // Side B: name, developer and publisher, year and genres, the store's
  // popular user tags, description and optional QR.
  function backCard(id, el, opts) {
    const d = DETAILS[id] || {};
    const pc = div("pcard back");
    pc.append(div("name", el.querySelector(".name").textContent));
    const credits = div("credits");
    const credit = (label, who) => {
      const line = document.createElement("div");
      line.append(Object.assign(document.createElement("b"), { textContent: label + ": " }), who);
      credits.append(line);
    };
    if (d.developer && d.developer === d.publisher) credit("Developer & publisher", d.developer);
    else {
      if (d.developer) credit("Developer", d.developer);
      if (d.publisher) credit("Publisher", d.publisher);
    }
    pc.append(credits);
    pc.append(div("meta", [d.year, (d.genres || []).slice(0, 3).join(", ")].filter(Boolean).join(" · ")));
    const tags = div("tags");
    for (const t of d.tags || []) tags.append(Object.assign(document.createElement("span"), { textContent: t }));
    pc.append(tags, div("desc", d.description || ""));
    if (opts.qr) {
      const qr = div("qr");
      qr.innerHTML = el.querySelector(".qr").innerHTML;
      pc.append(qr);
    }
    return pc;
  }

  function newSheet(t) {
    const sheet = div("sheet" + (t.cutlines ? " cutlines" : "") + (t.mono ? " mono" : ""));
    Object.assign(sheet.style, {
      width: t.page[0], height: t.page[1], padding: t.margin || "0", gap: t.gap,
      gridTemplateColumns: `repeat(${t.cols}, ${t.card[0]})`, gridTemplateRows: `repeat(${t.rows}, ${t.card[1]})`,
      placeContent: t.center ? "center" : "start",
    });
    return sheet;
  }

  // Puts a card in its cell. On landscape stock the portrait card is turned
  // by `turn` degrees to fit.
  function place(sheet, card, t, row, col, pad, turn) {
    const cell = div("cell");
    cell.style.gridRow = row + 1;
    cell.style.gridColumn = col + 1;
    if (pad) card.style.padding = pad;
    Object.assign(card.style, t.rotate
      ? { position: "absolute", width: t.card[1], height: t.card[0], left: "50%", top: "50%", transform: `translate(-50%, -50%) rotate(${turn}deg)` }
      : { position: "relative", width: "100%", height: "100%" });
    cell.append(card);
    sheet.append(cell);
  }

  // Builds the sheets for the chosen template and sides. With both sides,
  // each side A sheet is followed by its side B, mirrored left-to-right so
  // cards line up when the printer flips on the long edge.
  function buildPrint(apps = printTargets()) {
    const t = TEMPLATES[PRINT.template];
    const sides = PRINT.sides;
    const opts = { qr: PRINT.showQR };
    $("page-style").textContent = `@page { size: ${t.page[0]} ${t.page[1]}; margin: 0; }`;
    const root = $("print-root");
    root.replaceChildren();
    root.classList.toggle("rounded", PRINT.rounded);
    const waits = [];
    if (sides === "ab" && PRINT.oneSheet) {
      // Each card's side A and side B sit in consecutive cells, both facing
      // the same way, to be cut out and glued back to back.
      const perSheet = Math.floor(t.cols * t.rows / 2);
      for (let i = 0; i < apps.length; i += perSheet) {
        const sheet = newSheet(t);
        apps.slice(i, i + perSheet).forEach(({ id }, n) => {
          const el = cardEls[id], a = 2 * n, b = a + 1;
          place(sheet, artCard(id, el, opts, waits), t, Math.floor(a / t.cols), a % t.cols, null, -90);
          place(sheet, backCard(id, el, opts), t, Math.floor(b / t.cols), b % t.cols, t.pad, -90);
        });
        root.append(sheet);
      }
      return Promise.all(waits);
    }
    const perSheet = t.cols * t.rows;
    for (let i = 0; i < apps.length; i += perSheet) {
      const batch = apps.slice(i, i + perSheet);
      const front = newSheet(t), back = newSheet(t);
      batch.forEach(({ id }, n) => {
        const el = cardEls[id], row = Math.floor(n / t.cols), col = n % t.cols;
        // Turned cards face opposite ways on each side, so after a long-edge
        // flip both sides are upright on the same edge.
        if (sides.includes("a")) place(front, artCard(id, el, opts, waits), t, row, col, null, -90);
        if (sides.includes("b")) place(back, backCard(id, el, opts), t, row, sides === "ab" ? t.cols - 1 - col : col, t.pad, sides === "ab" ? 90 : -90);
      });
      if (sides.includes("a")) root.append(front);
      if (sides.includes("b")) root.append(back);
    }
    return Promise.all(waits);
  }
  async function printCards(apps, button) {
    button.disabled = true;
    try { await buildPrint(apps); window.print(); } finally { button.disabled = false; }
  }
  $("print").addEventListener("click", () => printCards(printTargets(), $("print")));
  window.addEventListener("beforeprint", () => { if (!$("print-root").children.length) buildPrint(); });
  window.addEventListener("afterprint", () => $("print-root").replaceChildren());

  // Esc does one thing: cancel linking, else clear the search, else clear the selection.
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape" || artDlg.open) return; // the dialog closes itself
    if (pending) api("cancel", {});
    else if (document.activeElement === search && search.value) { search.value = ""; rearrange(applyFilter); }
    else if (selected.size) clearSelection();
    else if (document.activeElement === search) search.blur();
  });

  if (NFC) {
    document.getElementById("cancel-link").addEventListener("click", () => api("cancel", {}));
    api();
    setInterval(api, 1000);
  }
</script>
</body>
</html>
